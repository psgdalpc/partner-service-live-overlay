<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920,height=1080,initial-scale=1">
  <title>Partner Service — Live Overlay</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="overlay" aria-hidden="true">

    <!-- Decorative moving light streaks -->
    <div class="light-streak streak-a"></div>
    <div class="light-streak streak-b"></div>
    <div class="light-streak streak-c"></div>
    <div class="particles"></div>

    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="brand-icon"><img src="logo.png" alt=""></div>
        <div class="brand-copy">
          <div class="brand-name">PARTNER</div>
          <div class="brand-service">SERVICE</div>
        </div>
      </div>

      <div class="headline">
        <span class="headline-main">TU PRÓXIMA OPORTUNIDAD</span>
        <span class="headline-accent">PUEDE EMPEZAR AQUÍ</span>
      </div>

      <div class="live-pill">
        <span class="live-dot"></span>
        <span>EN VIVO</span>
      </div>
    </header>

    <!-- Animated screen frame -->
    <section class="screen-frame frame">
      <div class="frame-glow"></div>
      <svg class="frame-svg" viewBox="0 0 1360 720" preserveAspectRatio="none">
        <rect class="frame-base" x="3" y="3" width="1354" height="714" rx="28"></rect>
        <rect class="frame-runner" x="3" y="3" width="1354" height="714" rx="28"></rect>
      </svg>
      <div class="frame-label screen-label">
        <span class="label-icon">▣</span>
        <span>PANTALLA COMPARTIDA</span>
      </div>
    </section>

    <!-- Animated camera frame -->
    <section class="camera-frame frame">
      <div class="frame-glow"></div>
      <svg class="frame-svg" viewBox="0 0 480 540" preserveAspectRatio="none">
        <rect class="frame-base" x="3" y="3" width="474" height="534" rx="26"></rect>
        <rect class="frame-runner" x="3" y="3" width="474" height="534" rx="26"></rect>
      </svg>
      <div class="frame-label camera-label">
        <span class="label-icon">●</span>
        <span>CÁMARA</span>
      </div>
    </section>

    <!-- Presenter card -->
    <div class="presenter-card">
      <div class="presenter-avatar">S</div>
      <div>
        <div class="presenter-name">SEBASTIÁN</div>
        <div class="presenter-role">Asistente de Reclutamiento y Selección</div>
      </div>
      <div class="card-light"></div>
    </div>

    <!-- Bottom CTA -->
    <footer class="bottom-bar">
      <div class="cta">
        <div class="cta-kicker">¿BUSCAS UNA NUEVA OPORTUNIDAD?</div>
        <div class="cta-main">HABLEMOS Y CONOCE NUESTRAS VACANTES</div>
      </div>

      <div class="whatsapp">
        <div class="wa-icon">WA</div>
        <div>
          <div class="wa-label">ESCRÍBEME POR WHATSAPP</div>
          <div class="wa-number">907 920 574</div>
        </div>
      </div>

      <div class="cta-end">TE ESPERAMOS <span>›</span></div>
    </footer>

    <!-- Small animated accent -->
    <div class="corner-orbit orbit-left"></div>
    <div class="corner-orbit orbit-right"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
